openapi: 3.0.3
info:
  title: Fintech Bank Core API
  version: 1.5.0
  description: |
    Core banking API (Stage 1). Contract-first. Amounts are integer kobo. Money-moving requests need Idempotency-Key.
    Version 1.1.0 adds the card operations listed in CARD_MODULE_UNBLOCKING_ADDENDUM.md. These are frontend/backend contract changes and require backend implementation before release.
    Version 1.2.0 proposes typed bill catalogs, saved billers, customer validation and vend/refund payment results as described in BILLS_API_UNBLOCKING_ADDENDUM.md; backend parity is pending.
    Version 1.3.0 proposes typed notification pages/read state and safe deep-link destinations as described in NOTIFICATIONS_API_UNBLOCKING_ADDENDUM.md; backend parity is pending.
    Version 1.4.0 proposes typed customer support tickets and ticket messages as described in SUPPORT_API_UNBLOCKING_ADDENDUM.md; backend parity is pending.
    Version 1.5.0 proposes account-scoped PDF statement requests and downloads as described in STATEMENTS_API_UNBLOCKING_ADDENDUM.md; backend parity is pending.
    Values marked [CONFIRM WITH ZENITH] are configuration, not constants.
  x-contract-status: frontend-backend-revision-pending-backend-parity
servers:
  - url: https://api.example.com/api/v1
    description: Replace per environment
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Onboarding
  - name: Accounts
  - name: Transfers
  - name: Bills
  - name: Cards
  - name: Support
  - name: Notifications
  - name: Statements
  - name: Security
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request an OTP for a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { description: OTP sent }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify an OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Verified; returns an onboarding or login session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerified' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with passcode (device bound)
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/pin/verify:
    post:
      tags: [Auth]
      summary: Verify transaction PIN and get a short-lived pin token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, minLength: 4, maxLength: 4 }
      responses:
        '200':
          description: Pin token valid for one action
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinToken: { type: string }
                  expiresInSeconds: { type: integer }
                required: [pinToken, expiresInSeconds]
        '401': { $ref: '#/components/responses/Error' }
  /onboarding/profile:
    put:
      tags: [Onboarding]
      summary: Save personal details and consents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingProfile' }
      responses:
        '200': { description: Saved }
  /onboarding/bvn:
    post:
      tags: [Onboarding]
      summary: Verify BVN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bvn]
              properties:
                bvn: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200': { description: Verified }
        '422': { $ref: '#/components/responses/Error' }
  /onboarding/nin:
    post:
      tags: [Onboarding]
      summary: Verify NIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nin]
              properties:
                nin: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200': { description: Verified }
        '422': { $ref: '#/components/responses/Error' }
  /onboarding/liveness:
    post:
      tags: [Onboarding]
      summary: Submit liveness result/selfie reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        '200': { description: Result }
  /onboarding/credentials:
    post:
      tags: [Onboarding]
      summary: Set passcode and transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode, pin]
              properties:
                passcode: { type: string, minLength: 6, maxLength: 6 }
                pin: { type: string, minLength: 4, maxLength: 4 }
      responses:
        '200': { description: Saved }
  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: Current onboarding step and account creation status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
  /accounts/me:
    get:
      tags: [Accounts]
      summary: Main account, balance, tier and limits
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /accounts/me/transactions:
    get:
      tags: [Accounts]
      summary: Transaction history
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TxnStatus' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  nextCursor: { type: string, nullable: true }
  /accounts/me/statements:
    get:
      tags: [Statements]
      summary: List statement requests and account statement capabilities
      responses:
        '200':
          description: Statement archive and server-configured request options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementArchive' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Statements]
      summary: Request account statement PDF generation or email delivery
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementRequestInput' }
      responses:
        '202':
          description: Statement request accepted for background generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementRequest' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /accounts/me/statements/{requestId}/download:
    get:
      tags: [Statements]
      summary: Download a generated statement PDF
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authenticated PDF attachment; private and non-cacheable
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /transactions/{id}:
    get:
      tags: [Accounts]
      summary: One transaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Error' }
  /name-enquiry:
    post:
      tags: [Transfers]
      summary: Resolve account name for a bank and account number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber]
              properties:
                bankCode: { type: string }
                accountNumber: { type: string, pattern: '^[0-9]{10}$' }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountName: { type: string }
                  sameBank: { type: boolean }
        '422': { $ref: '#/components/responses/Error' }
  /transfers/quote:
    post:
      tags: [Transfers]
      summary: Quote fee, limits and total
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferQuote' }
        '422': { $ref: '#/components/responses/Error' }
  /transfers:
    post:
      tags: [Transfers]
      summary: Submit a transfer (idempotent)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PinToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '202':
          description: Pending (outcome unknown, will be resolved)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /beneficiaries:
    get:
      tags: [Transfers]
      summary: List beneficiaries
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Beneficiary' }
    post:
      tags: [Transfers]
      summary: Add beneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Beneficiary' }
      responses:
        '201': { description: Created }
  /beneficiaries/{id}:
    delete:
      tags: [Transfers]
      summary: Remove beneficiary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
  /bills/categories:
    get:
      tags: [Bills]
      summary: Bill categories and billers
      responses:
        '200':
          description: Bill categories, billers and available products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BillCategory' }
  /bills/saved:
    get:
      tags: [Bills]
      summary: List saved billers for the authenticated account
      responses:
        '200':
          description: Saved billers with masked customer references
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedBiller' }
  /bills/validate:
    post:
      tags: [Bills]
      summary: Validate a customer reference (meter, decoder, phone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [billerCode, productCode]
                  properties:
                    billerCode: { type: string }
                    productCode: { type: string }
                    customerRef: { type: string, nullable: true }
                - type: object
                  required: [savedBillerId]
                  properties:
                    savedBillerId: { type: string, format: uuid }
      responses:
        '200':
          description: Validated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillValidation' }
        '422': { $ref: '#/components/responses/Error' }
  /bills/pay:
    post:
      tags: [Bills]
      summary: Pay a bill or buy airtime/data (idempotent)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PinToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillPayRequest' }
      responses:
        '200':
          description: Vend result and transaction state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPaymentResult' }
        '202':
          description: Vend or token delivery is pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPaymentResult' }
        '422': { $ref: '#/components/responses/Error' }
  /cards:
    get:
      tags: [Cards]
      summary: List cards
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
    post:
      tags: [Cards]
      summary: Create a virtual naira card (idempotent)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PinToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, theme]
              properties:
                label: { type: string, maxLength: 30 }
                theme: { type: string, enum: [BERRY, MIDNIGHT, CORAL, FOREST, SAND, SLATE] }
                dailyLimitKobo: { type: integer, format: int64 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '422': { $ref: '#/components/responses/Error' }
  /cards/{id}/freeze:
    post:
      tags: [Cards]
      summary: Freeze or unfreeze
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frozen]
              properties:
                frozen: { type: boolean }
      responses:
        '200': { description: Updated }
  /cards/{id}/details:
    post:
      tags: [Cards]
      summary: Reveal card details (requires PIN token; never stored on device)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PinToken' }
      responses:
        '200':
          description: Details valid for display only
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string }
                  expiry: { type: string }
                  cvv: { type: string }
  /cards/{id}/limits:
    put:
      tags: [Cards]
      summary: Set card limits after transaction PIN verification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PinToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                perTxnLimitKobo: { type: integer, format: int64 }
                dailyLimitKobo: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated effective card limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /cards/{id}/transactions:
    get:
      tags: [Cards]
      summary: List transactions for one card
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TxnStatus' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Page of transactions for this card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '404': { $ref: '#/components/responses/Error' }
  /cards/{id}/settings:
    get:
      tags: [Cards]
      summary: Read card alert and usage settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current effective card settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardSettings' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Cards]
      summary: Update card alert and usage settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardSettingsUpdate' }
      responses:
        '200':
          description: Effective settings after update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardSettings' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /cards/{id}:
    patch:
      tags: [Cards]
      summary: Rename a card or change its visual theme
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                label: { type: string, minLength: 1, maxLength: 30 }
                theme: { type: string, enum: [BERRY, MIDNIGHT, CORAL, FOREST, SAND, SLATE] }
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cards]
      summary: Delete a card after transaction PIN verification
      description: Deletion marks the card DELETED; transaction history is retained and the card cannot be reactivated.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PinToken' }
      responses:
        '204': { description: Card deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /kyc/status:
    get:
      tags: [Onboarding]
      summary: Current tier and upgrade checklist
      responses:
        '200': { description: Status }
  /security/devices:
    get:
      tags: [Security]
      summary: List devices
      responses:
        '200': { description: Devices }
  /security/devices/{id}:
    delete:
      tags: [Security]
      summary: Remove a device
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
  /security/lock:
    post:
      tags: [Security]
      summary: Customer locks own account
      parameters:
        - { $ref: '#/components/parameters/PinToken' }
      responses:
        '200': { description: Locked }
  /tickets:
    get:
      tags: [Support]
      summary: List the authenticated customer's tickets
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
    post:
      tags: [Support]
      summary: Create ticket (optionally linked to a transaction)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category: { type: string, enum: [TRANSFER, CARD, ACCOUNT, BILL_PAYMENT, SECURITY, OTHER] }
                issueType: { type: string, enum: [NOT_RECEIVED, CHARGED_BUT_FAILED, WRONG_AMOUNT, UNAUTHORIZED, OTHER] }
                description: { type: string, minLength: 1, maxLength: 4000 }
                transactionId: { type: string, format: uuid }
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
  /tickets/{id}:
    get:
      tags: [Support]
      summary: Get an owned ticket and conversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /tickets/{id}/messages:
    post:
      tags: [Support]
      summary: Add a customer reply to an owned ticket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportMessage' }
        '404': { $ref: '#/components/responses/Error' }
  /notifications:
    get:
      tags: [Notifications]
      summary: In-app notifications
      parameters:
        - name: category
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [TRANSACTION, SECURITY, SYSTEM, SAVINGS, GENERAL] }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one owned notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Read state updated }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all read
      responses:
        '204': { description: Done }
      description: Marks all notifications owned by the authenticated user as read.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    PinToken:
      name: X-Pin-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    StatementRequestInput:
      type: object
      required: [fromDate, toDate, format, deliveryMethod]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        format: { type: string, enum: [PDF] }
        deliveryMethod: { type: string, enum: [DOWNLOAD, EMAIL] }
    StatementRequest:
      type: object
      required: [requestId, fromDate, toDate, format, deliveryMethod, status, deliveryStatus, createdAt]
      properties:
        requestId: { type: string, format: uuid }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        format: { type: string, enum: [PDF] }
        deliveryMethod: { type: string, enum: [DOWNLOAD, EMAIL] }
        status: { type: string, enum: [QUEUED, GENERATING, READY, FAILED] }
        deliveryStatus: { type: string, enum: [NOT_APPLICABLE, PENDING, SENT, FAILED] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        failureCode: { type: string, nullable: true }
    StatementArchive:
      type: object
      required: [items, maximumRangeDays, emailDeliveryAvailable]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StatementRequest' }
        maximumRangeDays: { type: integer, minimum: 1 }
        emailDeliveryAvailable: { type: boolean }
        registeredEmailMasked:
          type: string
          nullable: true
          description: Required and non-empty when emailDeliveryAvailable is true; otherwise null or omitted.
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: TRF_LIMIT_EXCEEDED }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, example: '+2348012345678' }
        purpose: { type: string, enum: [SIGNUP, LOGIN_NEW_DEVICE, PASSCODE_RESET, STEP_UP] }
    OtpVerify:
      type: object
      required: [phone, code, purpose]
      properties:
        phone: { type: string }
        code: { type: string, minLength: 6, maxLength: 6 }
        purpose: { type: string }
    OtpVerified:
      type: object
      properties:
        sessionToken: { type: string }
        nextStep: { type: string }
    LoginRequest:
      type: object
      required: [identifier, passcode]
      properties:
        identifier: { type: string, description: Phone or email }
        passcode: { type: string, minLength: 6, maxLength: 6 }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer }
    OnboardingProfile:
      type: object
      required: [firstName, lastName, dateOfBirth, email, consents]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        email: { type: string, format: email }
        referralCode: { type: string }
        consents:
          type: array
          items:
            type: object
            properties:
              documentType: { type: string }
              documentVersion: { type: string }
              granted: { type: boolean }
    OnboardingStatus:
      type: object
      properties:
        step: { type: string }
        status: { type: string, enum: [ONBOARDING, PENDING_ACCOUNT, ACTIVE, MANUAL_REVIEW, REJECTED] }
        accountNumber: { type: string, nullable: true }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountNumber: { type: string }
        accountName: { type: string }
        status: { type: string, enum: [ACTIVE, LOCKED, RESTRICTED, DORMANT, CLOSED] }
        tier: { type: integer }
        currency: { type: string, example: NGN }
        ledgerBalanceKobo: { type: integer, format: int64 }
        availableBalanceKobo: { type: integer, format: int64 }
        limits:
          type: object
          properties:
            perTxnKobo: { type: integer, format: int64 }
            dailyOutKobo: { type: integer, format: int64 }
            dailyUsedKobo: { type: integer, format: int64 }
            balanceCapKobo: { type: integer, format: int64 }
    TxnStatus:
      type: string
      enum: [PENDING, SUCCESSFUL, FAILED, REVERSED]
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        type: { type: string }
        direction: { type: string, enum: [D, C] }
        amountKobo: { type: integer, format: int64 }
        feeKobo: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/TxnStatus' }
        counterpartyName: { type: string }
        counterpartyBank: { type: string }
        narration: { type: string }
        failureCode: { type: string, nullable: true }
        balanceAfterKobo: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    TransferRequest:
      type: object
      required: [bankCode, accountNumber, amountKobo]
      properties:
        bankCode: { type: string }
        accountNumber: { type: string }
        accountName: { type: string }
        amountKobo: { type: integer, format: int64, minimum: 1 }
        narration: { type: string, maxLength: 100 }
        saveBeneficiary: { type: boolean }
    TransferQuote:
      type: object
      properties:
        quoteId: { type: string, format: uuid }
        amountKobo: { type: integer, format: int64 }
        feeKobo: { type: integer, format: int64 }
        totalKobo: { type: integer, format: int64 }
        recipientName: { type: string }
        expiresAt: { type: string, format: date-time }
        stepUpRequired: { type: boolean }
    Beneficiary:
      type: object
      properties:
        id: { type: string, format: uuid }
        bankCode: { type: string }
        accountNumber: { type: string }
        accountName: { type: string }
        nickname: { type: string }
        favourite: { type: boolean }
    BillPayRequest:
      type: object
      required: [validationId, amountKobo]
      properties:
        validationId: { type: string, format: uuid }
        amountKobo: { type: integer, format: int64 }
        saveBiller: { type: boolean }
        deliveryPhone: { type: string, nullable: true }
    BillCategory:
      type: object
      required: [code, name, description, displayOrder, billers]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        displayOrder: { type: integer }
        billers:
          type: array
          items: { $ref: '#/components/schemas/BillerCatalogEntry' }
    BillerCatalogEntry:
      type: object
      required: [code, name, categoryCode, customerReferenceLabel, products]
      properties:
        code: { type: string }
        name: { type: string }
        categoryCode: { type: string }
        description: { type: string }
        customerReferenceLabel: { type: string }
        customerReferencePattern: { type: string, nullable: true }
        products:
          type: array
          items: { $ref: '#/components/schemas/BillProduct' }
    BillProduct:
      type: object
      required: [code, name, requiresCustomerReference]
      properties:
        code: { type: string }
        name: { type: string }
        fixedAmountKobo: { type: integer, format: int64, nullable: true }
        minimumAmountKobo: { type: integer, format: int64, nullable: true }
        maximumAmountKobo: { type: integer, format: int64, nullable: true }
        requiresCustomerReference: { type: boolean }
    SavedBiller:
      type: object
      required: [id, billerCode, billerName, categoryCode, customerReferenceMasked]
      properties:
        id: { type: string, format: uuid }
        billerCode: { type: string }
        productCode: { type: string, nullable: true }
        billerName: { type: string }
        productName: { type: string, nullable: true }
        categoryCode: { type: string }
        customerReferenceMasked: { type: string }
        customerReferenceSuffix: { type: string, nullable: true }
        lastPaidAt: { type: string, format: date-time, nullable: true }
    BillValidation:
      type: object
      required: [validationId, customerName, billerName, productName, validatedAt, expiresAt]
      properties:
        validationId: { type: string, format: uuid }
        customerName: { type: string }
        billerName: { type: string }
        productName: { type: string }
        validatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        fixedAmountKobo: { type: integer, format: int64, nullable: true }
        minimumAmountKobo: { type: integer, format: int64, nullable: true }
        maximumAmountKobo: { type: integer, format: int64, nullable: true }
        feeKobo: { type: integer, format: int64, nullable: true }
    BillPaymentResult:
      type: object
      required: [transaction, vendStatus, tokenDeliveryStatus, refundStatus]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        vendStatus: { type: string, enum: [PENDING, SUCCESSFUL, FAILED] }
        token: { type: string, nullable: true }
        tokenType: { type: string, nullable: true }
        tokenDeliveryStatus: { type: string, enum: [NOT_REQUIRED, PENDING, DELIVERED, FAILED] }
        refundStatus: { type: string, enum: [NOT_REQUIRED, PENDING, REFUNDED, FAILED] }
    NotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: string, nullable: true }
        unreadCount: { type: integer, minimum: 0 }
    Notification:
      type: object
      required: [id, category, title, body, createdAt, isRead, destination]
      properties:
        id: { type: string }
        category: { type: string, enum: [TRANSACTION, SECURITY, SYSTEM, SAVINGS, GENERAL] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }
        destination: { $ref: '#/components/schemas/NotificationDestination' }
    NotificationDestination:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [TRANSACTION, ACCOUNT, PAYMENTS, CARDS, NONE] }
        resourceId: { type: string }
    TicketPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportTicket' }
        nextCursor: { type: string, nullable: true }
    SupportTicket:
      type: object
      required: [id, category, subject, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        category: { type: string, enum: [TRANSFER, CARD, ACCOUNT, BILL_PAYMENT, SECURITY, OTHER] }
        subject: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        issueType: { type: string, enum: [NOT_RECEIVED, CHARGED_BUT_FAILED, WRONG_AMOUNT, UNAUTHORIZED, OTHER] }
        transactionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupportTicketDetail:
      allOf:
        - { $ref: '#/components/schemas/SupportTicket' }
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/SupportMessage' }
    SupportMessage:
      type: object
      required: [id, authorType, body, createdAt]
      properties:
        id: { type: string }
        authorType: { type: string, enum: [CUSTOMER, SUPPORT] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    Card:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        theme: { type: string, enum: [BERRY, MIDNIGHT, CORAL, FOREST, SAND, SLATE] }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        status: { type: string, enum: [CREATING, ACTIVE, FROZEN, EXPIRED, DELETED] }
        perTxnLimitKobo: { type: integer, format: int64, nullable: true }
        dailyLimitKobo: { type: integer, format: int64, nullable: true }
    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { type: string, nullable: true }
    CardSettings:
      type: object
      required: [pushAlerts, smsAlerts, onlinePurchases]
      properties:
        pushAlerts: { type: boolean }
        smsAlerts: { type: boolean }
        onlinePurchases: { type: boolean }
        internationalPurchases: { type: boolean, nullable: true, description: Available only when international controls are enabled for the account. }
    CardSettingsUpdate:
      type: object
      required: [pushAlerts, smsAlerts, onlinePurchases]
      properties:
        pushAlerts: { type: boolean }
        smsAlerts: { type: boolean }
        onlinePurchases: { type: boolean }
        internationalPurchases: { type: boolean, nullable: true, description: Omit unless international controls are enabled for the account. }
