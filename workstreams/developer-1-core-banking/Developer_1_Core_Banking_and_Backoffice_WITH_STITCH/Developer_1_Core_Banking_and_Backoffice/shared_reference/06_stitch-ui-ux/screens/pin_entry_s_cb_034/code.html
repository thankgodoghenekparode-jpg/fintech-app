<!DOCTYPE html>

<style>
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-full bg-surface-container flex justify-center items-center text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Canvas Frame: 390px x 844px context container -->
<main class="w-full max-w-[390px] h-full sm:h-[844px] max-h-[844px] bg-surface flex flex-col justify-between shadow-2xl overflow-hidden relative">
<!-- Screen Content: Top Stack -->
<div class="flex flex-col w-full">
<!-- Navigation Header -->
<header class="flex justify-between items-center px-margin pt-space-lg pb-space-xs min-h-[56px] w-full">
<!-- Close / Cancel Button -->
<button aria-label="Cancel transaction" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Brand Wordmark -->
<span class="font-title text-title font-bold text-primary tracking-tight">YourApp</span>
<!-- Institutional Security Badge -->
<div class="flex items-center gap-space-xs bg-surface-container-low px-space-sm py-1 rounded-full border border-outline-variant/40" title="Protected by Institutional Grade Security">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-caption text-caption text-on-surface-variant font-medium">Secure</span>
</div>
</header>
<!-- Main Interaction Area -->
<div class="px-margin pt-space-sm flex flex-col items-center text-center">
<!-- Transfer Recap Strip (Bento-style card) -->
<div class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-space-md mb-space-lg shadow-sm flex items-center gap-space-md text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[20px]">send</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<span class="font-caption text-caption text-on-surface-variant">Authorizing transfer</span>
<div class="font-body-medium text-body-medium text-on-surface truncate">
<span class="font-bold tabular-nums text-primary">₦25,000.00</span>
<span class="text-on-surface-variant font-normal"> to </span>
<span class="font-semibold text-on-surface">Amina Yusuf</span>
</div>
</div>
</div>
<!-- Title & Subtitle Hierarchy -->
<h1 class="font-title text-title text-on-surface mb-space-xs">Enter 4-digit transaction PIN</h1>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mb-space-xl">
          Enter your transaction PIN to authorize this payment
        </p>
<!-- PIN Dots Display -->
<div aria-label="PIN entry status" class="flex items-center justify-center gap-space-lg mb-space-xl">
<!-- Digit 1: Filled -->
<div class="w-4 h-4 rounded-full bg-primary transition-all duration-200 transform scale-100 shadow-sm"></div>
<!-- Digit 2: Filled -->
<div class="w-4 h-4 rounded-full bg-primary transition-all duration-200 transform scale-100 shadow-sm"></div>
<!-- Digit 3: Active / Empty Indicator -->
<div class="w-4 h-4 rounded-full border-2 border-primary bg-surface transition-all duration-200"></div>
<!-- Digit 4: Unfilled -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/40 transition-all duration-200"></div>
</div>
<!-- Security Guarantee Micro-Badge -->
<div class="flex items-center gap-space-xs text-on-surface-variant bg-surface-container-lowest/80 px-space-md py-1.5 rounded-full border border-outline-variant/30 mb-space-xs">
<span class="material-symbols-outlined text-primary text-[15px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-caption text-caption text-[11px] font-medium tracking-wide">256-bit institutional encryption • CBN licensed</span>
</div>
</div>
</div>
<!-- Bottom Functional Stack: Keypad & Recovery Action -->
<div class="w-full bg-surface-container-lowest border-t border-outline-variant/40 pt-space-md pb-space-lg px-margin flex flex-col items-center">
<!-- 3x4 Touch Ergonomics Keypad (All targets >= 48px) -->
<div class="grid grid-cols-3 gap-y-2 gap-x-6 w-full max-w-[320px] mb-space-sm">
<!-- Key 1 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">1</span>
</button>
<!-- Key 2 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">2</span>
</button>
<!-- Key 3 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">3</span>
</button>
<!-- Key 4 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">4</span>
</button>
<!-- Key 5 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">5</span>
</button>
<!-- Key 6 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">6</span>
</button>
<!-- Key 7 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">7</span>
</button>
<!-- Key 8 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">8</span>
</button>
<!-- Key 9 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">9</span>
</button>
<!-- Key Bottom Left: Biometric Face/Fingerprint -->
<button aria-label="Use biometric authentication" class="h-14 flex items-center justify-center rounded-xl text-primary hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[28px]">fingerprint</span>
</button>
<!-- Key Bottom Center: 0 -->
<button class="h-14 flex items-center justify-center rounded-xl bg-surface-container-low/50 hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="font-title text-title text-on-surface font-semibold tabular-nums">0</span>
</button>
<!-- Key Bottom Right: Delete/Backspace -->
<button aria-label="Delete last digit" class="h-14 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-container active:bg-primary-fixed/40 transition-all active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[26px]">backspace</span>
</button>
</div>
<!-- Forgot PIN Action Link -->
<a class="h-12 flex items-center justify-center font-label text-label text-primary hover:text-on-primary-fixed-variant transition-colors underline decoration-outline-variant/60 underline-offset-4" href="#">
        Forgot transaction PIN?
      </a>
</div>
</main>
</body></html>
