<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #100e0f;
      color: #e7e1e2;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface flex justify-center items-center min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile Viewport Canvas Container (390 x 844 reference, max-w-[430px]) -->
<main class="w-full max-w-[412px] min-h-[844px] h-screen max-h-[915px] bg-[#121011] flex flex-col justify-between relative overflow-hidden shadow-2xl border border-outline-variant/30 sm:rounded-[36px]">
<!-- Ambient Subtle Glow Background -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Header Section (Top bar following TopAppBar minimal rules for transactional sub-flow: BottomNav intentionally suppressed) -->
<header class="w-full px-margin-mobile pt-4 pb-2 flex justify-between items-center z-10 shrink-0">
<div class="flex items-center gap-space-xs">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-primary-fixed">YourApp</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container border border-outline-variant/40 font-label-sm text-label-sm text-on-surface-variant text-[10px] tracking-wider uppercase">NG</span>
</div>
<div class="flex items-center gap-space-sm">
<button aria-label="Switch account" class="px-3 py-1.5 rounded-full bg-surface-container border border-outline-variant/40 text-on-surface-variant font-label-md text-label-md flex items-center gap-1 active:scale-95 transition-transform duration-150 hover:border-outline hover:text-on-surface" type="button">
<span>Switch</span>
<span class="material-symbols-outlined text-[16px]" data-icon="swap_horiz">swap_horiz</span>
</button>
<button aria-label="Support &amp; Help" class="w-9 h-9 rounded-full bg-surface-container border border-outline-variant/40 flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform duration-150 hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<!-- Main Content Flow: Profile Greeting & Passcode Prompt -->
<div class="w-full px-margin-mobile flex flex-col items-center text-center z-10 pt-2 pb-1 shrink-0">
<!-- Profile Greeting Cluster -->
<div class="relative mb-3">
<div class="w-16 h-16 rounded-full bg-surface-container-high border-2 border-outline-variant/60 flex items-center justify-center shadow-lg relative">
<span class="font-headline-md text-headline-md font-semibold text-primary tracking-wide">CA</span>
<!-- Active Secure Status Indicator -->
<div class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-[#121011] flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-[#4CC38A]"></div>
</div>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-0.5">Welcome back, Chioma</h1>
<p class="font-body-md text-body-md text-on-surface-variant tracking-wider font-mono">+234 801 ••• 5678</p>
<!-- Passcode Prompt & PIN Dots Container -->
<div class="mt-6 mb-2 flex flex-col items-center">
<p class="font-label-md text-label-md text-on-surface-variant mb-4">Enter your 6-digit login passcode</p>
<!-- 6 Passcode Indicators (First 3 filled, next 3 unfilled) -->
<div aria-label="3 of 6 digits entered" class="flex items-center gap-4 py-2" role="status">
<!-- Dot 1: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.6)] ring-2 ring-primary-container/30 transition-all duration-200"></div>
<!-- Dot 2: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.6)] ring-2 ring-primary-container/30 transition-all duration-200"></div>
<!-- Dot 3: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.6)] ring-2 ring-primary-container/30 transition-all duration-200"></div>
<!-- Dot 4: Outline/Empty -->
<div class="w-3.5 h-3.5 rounded-full border-2 border-[#3A3335] bg-transparent transition-all duration-200"></div>
<!-- Dot 5: Outline/Empty -->
<div class="w-3.5 h-3.5 rounded-full border-2 border-[#3A3335] bg-transparent transition-all duration-200"></div>
<!-- Dot 6: Outline/Empty -->
<div class="w-3.5 h-3.5 rounded-full border-2 border-[#3A3335] bg-transparent transition-all duration-200"></div>
</div>
</div>
<!-- Quick Action Navigation Links -->
<div class="w-full flex items-center justify-between px-space-md mt-4 max-w-[340px]">
<button class="font-label-md text-label-md text-primary-container font-semibold hover:underline active:opacity-75 transition-opacity" type="button">
          Forgot passcode?
        </button>
<button class="font-label-md text-label-md text-primary font-semibold flex items-center gap-1 active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="fingerprint">fingerprint</span>
<span>Use Biometrics</span>
</button>
</div>
</div>
<!-- Numeric Keypad Layout (3x4 Grid, touch-optimized >= 52px) -->
<div class="w-full px-margin-mobile pb-2 z-10">
<div aria-label="PIN entry keypad" class="grid grid-cols-3 gap-2.5 max-w-[350px] mx-auto" role="grid">
<!-- Key 1 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">1</span>
</button>
<!-- Key 2 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">2</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">ABC</span>
</button>
<!-- Key 3 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">3</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">DEF</span>
</button>
<!-- Key 4 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">4</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">GHI</span>
</button>
<!-- Key 5 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">5</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">JKL</span>
</button>
<!-- Key 6 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">6</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">MNO</span>
</button>
<!-- Key 7 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">7</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">PQRS</span>
</button>
<!-- Key 8 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">8</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">TUV</span>
</button>
<!-- Key 9 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none group" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">9</span>
<span class="font-label-sm text-[10px] text-outline tracking-wider mt-0.5">WXYZ</span>
</button>
<!-- Key Bottom-Left: Biometric Scanner Button -->
<button aria-label="Authenticate with fingerprint" class="h-14 rounded-xl bg-[#1C1819]/50 border border-transparent flex items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-primary-container hover:border-primary-container/40" type="button">
<span class="material-symbols-outlined text-[28px]" data-icon="fingerprint">fingerprint</span>
</button>
<!-- Key 0 -->
<button class="h-14 rounded-xl bg-[#1C1819] border border-[#3A3335] flex flex-col items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-[#F5F1F0] select-none" type="button">
<span class="font-headline-md text-headline-md font-semibold font-mono leading-none">0</span>
</button>
<!-- Key Bottom-Right: Backspace / Delete -->
<button aria-label="Delete last digit" class="h-14 rounded-xl bg-[#1C1819]/50 border border-transparent flex items-center justify-center active:bg-[#262122] active:scale-95 transition-all text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[26px]" data-icon="backspace">backspace</span>
</button>
</div>
</div>
<!-- Security Compliance Footer Banner -->
<footer class="w-full px-margin-mobile pb-5 pt-1 z-10 flex flex-col items-center justify-center shrink-0">
<div class="flex items-center gap-1.5 text-outline/80 font-label-sm text-label-sm tracking-normal">
<span class="material-symbols-outlined text-[14px] text-[#4CC38A]" data-icon="lock">lock</span>
<span>Bank-grade 256-bit encryption • CBN Regulated</span>
</div>
<p class="font-label-sm text-[10px] text-outline-variant mt-0.5">Screen ID: S-CB-013</p>
</footer>
</main>
<script>
    // Lightweight interactive micro-feedback for keypad tap animation
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function() {
        if (navigator.vibrate) {
          navigator.vibrate(12);
        }
      });
    });
  </script>
</body></html>
