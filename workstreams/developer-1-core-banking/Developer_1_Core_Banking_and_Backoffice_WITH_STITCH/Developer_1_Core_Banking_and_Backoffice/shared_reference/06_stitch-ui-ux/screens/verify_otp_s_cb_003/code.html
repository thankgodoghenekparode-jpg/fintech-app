<style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      display: inline-block;
    }

<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Container (390px x 844px context with responsive safe frame) -->
<main class="w-full max-w-[430px] min-h-[844px] bg-surface flex flex-col justify-between relative px-margin pt-space-md pb-space-lg shadow-[0_4px_24px_rgba(30,26,27,0.06)] border-x border-outline-variant/30">
<!-- Top Content Section -->
<div class="w-full flex flex-col">
<!-- Top Navigation & Progress Bar -->
<header class="w-full pt-space-xs pb-space-md">
<div class="flex items-center justify-between min-h-[48px]">
<!-- Back Button (Touch target 48x48px) -->
<button aria-label="Go back" class="w-12 h-12 -ml-2 rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Step Badge Indicator -->
<div class="flex items-center gap-space-xs px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant/50">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-caption text-caption font-medium text-on-surface-variant">Step 2 of 6</span>
</div>
<!-- Invisible Balancer for strict symmetric alignment -->
<div aria-hidden="true" class="w-12 h-12"></div>
</div>
<!-- Progress Track (Visual indicator Step 2/6) -->
<div aria-valuemax="100" aria-valuemin="0" aria-valuenow="33" class="w-full h-1 bg-surface-container-high rounded-full mt-space-sm overflow-hidden" role="progressbar">
<div class="h-full bg-primary-container rounded-full w-2/6 transition-all duration-300"></div>
</div>
</header>
<!-- Headline & Subtitle Block -->
<section class="mt-space-lg">
<h1 class="font-title text-title text-on-surface">Enter 6-digit code</h1>
<div class="mt-space-xs flex flex-wrap items-center gap-x-1.5 gap-y-0.5">
<p class="font-body text-body text-on-surface-variant">Sent via SMS to</p>
<span class="font-body-medium text-body-medium text-on-surface tracking-tight">+234 801 ••• ••78</span>
<button class="inline-flex items-center font-label text-label text-primary-container hover:underline active:opacity-80 py-1 px-1 rounded transition-colors" type="button">
            Edit number
          </button>
</div>
</section>
<!-- OTP 6-Digit Display Cells -->
<section aria-label="One-Time PIN entry" class="mt-space-xl">
<div class="grid grid-cols-6 gap-2 w-full max-w-[358px] mx-auto">
<!-- Digit 1: Filled -->
<div class="h-14 rounded-xl bg-surface-container-lowest border border-outline-variant flex items-center justify-center shadow-sm">
<span class="font-title text-title text-on-surface">5</span>
</div>
<!-- Digit 2: Filled -->
<div class="h-14 rounded-xl bg-surface-container-lowest border border-outline-variant flex items-center justify-center shadow-sm">
<span class="font-title text-title text-on-surface">8</span>
</div>
<!-- Digit 3: Filled -->
<div class="h-14 rounded-xl bg-surface-container-lowest border border-outline-variant flex items-center justify-center shadow-sm">
<span class="font-title text-title text-on-surface">2</span>
</div>
<!-- Digit 4: Active / Focused with Animated Caret -->
<div class="h-14 rounded-xl bg-surface-container-lowest border-2 border-primary-container flex items-center justify-center shadow-[0_0_0_3px_rgba(142,27,74,0.12)] relative">
<span class="w-[2px] h-6 bg-primary-container caret-blink rounded-full"></span>
</div>
<!-- Digit 5: Empty -->
<div class="h-14 rounded-xl bg-surface-container-lowest border border-outline-variant/70 flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-outline-variant/60"></span>
</div>
<!-- Digit 6: Empty -->
<div class="h-14 rounded-xl bg-surface-container-lowest border border-outline-variant/70 flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-outline-variant/60"></span>
</div>
</div>
<!-- Timer / Resend Row (Strict status iconography + label) -->
<div class="mt-space-lg flex items-center justify-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] leading-none text-on-surface-variant" data-icon="schedule">schedule</span>
<span class="font-caption text-caption text-on-surface-variant">Resend code in <strong class="font-body-medium text-on-surface tabular-nums">0:42</strong></span>
</div>
</div>
</section>
<!-- Alternate Channel Link -->
<div class="mt-space-lg text-center">
<button class="inline-flex items-center justify-center gap-2 px-3 py-2 text-on-surface-variant hover:text-primary active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[18px] text-primary-container" data-icon="chat">chat</span>
<span class="font-label text-label text-on-surface-variant">Didn't receive code? <span class="text-primary-container font-semibold underline underline-offset-2">Try WhatsApp verification</span></span>
</button>
</div>
</div>

<div aria-label="Numeric Keypad" class="grid grid-cols-3 gap-y-2 gap-x-4 max-w-[340px] mx-auto pb-space-xs" role="region">
<!-- Key 1 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">

<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium"></span>
</button>
<!-- Key 2 -->

<span class="font-title text-title text-on-surface leading-tight">2</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">ABC</span>
</button>
<!-- Key 3 -->

<span class="font-title text-title text-on-surface leading-tight">3</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">DEF</span>
</button>
<!-- Key 4 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">4</span>

<!-- Key 5 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">5</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">JKL</span>
</button>
<!-- Key 6 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">6</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">MNO</span>
</button>
<!-- Key 7 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">7</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">PQRS</span>
</button>
<!-- Key 8 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">8</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">TUV</span>
</button>
<!-- Key 9 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">9</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">WXYZ</span>
</button>
<!-- Key Biometric / Optional Fast-fill -->
<button aria-label="Biometric autofill" class="h-14 min-h-[48px] rounded-xl flex items-center justify-center text-primary-container active:bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[26px]" data-icon="fingerprint">fingerprint</span>
</button>
<!-- Key 0 -->
<button class="h-14 min-h-[48px] rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest active:bg-surface-container border border-outline-variant/40 shadow-[0_1px_3px_rgba(30,26,27,0.03)] active:scale-95 transition-transform duration-100 select-none" type="button">
<span class="font-title text-title text-on-surface leading-tight">0</span>
<span class="text-[10px] uppercase tracking-widest text-outline -mt-0.5 opacity-70 font-medium">+</span>
</button>
<!-- Key Backspace -->
<button aria-label="Delete last digit" class="h-14 min-h-[48px] rounded-xl flex items-center justify-center text-on-surface active:bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="backspace">backspace</span>
</button>
</div>
<!-- Institutional Security Assurance Anchor -->
<div class="flex items-center justify-center gap-1.5 pt-space-sm text-outline">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span class="font-caption text-caption text-on-surface-variant font-medium">CBN Licensed &amp; NDIC Insured</span>
</div>
</footer>
</main>
