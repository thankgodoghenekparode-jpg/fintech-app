<style>
    @keyframes scan {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 96%; opacity: 0.2; }
    }
    .animate-scan-beam {
      animation: scan 2.4s ease-in-out infinite alternate;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex justify-center items-center p-0 selection:bg-primary selection:text-on-primary">
<main class="w-full max-w-[390px] h-[844px] bg-surface relative flex flex-col overflow-hidden shadow-2xl border border-outline-variant/30">
<!-- Top Action Bar (Dedicated task screen layout with back action) -->
<header class="flex items-center justify-between px-margin py-space-sm z-30 bg-surface/90 backdrop-blur-md min-h-[56px] border-b border-outline-variant/20">
<button aria-label="Close scanner" class="w-[42px] h-[42px] rounded-xl bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Scan &amp; Pay</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">S-CB-039</span>
</div>
<button aria-label="Toggle flash" class="w-[42px] h-[42px] rounded-xl bg-surface-container flex items-center justify-center text-primary-container hover:bg-surface-container-high transition-colors active:scale-95 duration-150" id="torch-btn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="flash_on">flash_on</span>
</button>
</header>
<!-- Segmented Tab Switcher -->
<section class="px-margin pt-space-sm pb-space-xs z-30">
<div class="grid grid-cols-2 bg-surface-container-low p-1 rounded-xl border border-outline-variant/30">
<button class="py-space-xs text-center font-label-md text-label-md rounded-lg bg-surface-container text-primary font-semibold transition-all" type="button">
          Scan QR Code
        </button>
<button class="py-space-xs text-center font-label-md text-label-md rounded-lg text-on-surface-variant hover:text-on-surface transition-colors font-medium" type="button">
          My QR Code
        </button>
</div>
</section>
<!-- Viewfinder Area with dark lens backdrop & glowing brackets -->
<div class="relative flex-1 flex flex-col items-center justify-center px-margin overflow-hidden">
<!-- Camera Lens Atmosphere Overlay -->
<div class="absolute inset-0 bg-surface-container-lowest/80 flex items-center justify-center pointer-events-none">
<div class="w-[280px] h-[280px] rounded-2xl bg-surface-container-low/20 shadow-[0_0_80px_rgba(0,0,0,0.9)]"></div>
</div>
<!-- Viewfinder Target Frame -->
<div class="relative w-[250px] h-[250px] rounded-xl z-20 flex items-center justify-center">
<!-- Glowing Rose Corner Brackets -->
<span class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary-container rounded-tl-xl shadow-[0_0_12px_rgba(224,112,154,0.6)]"></span>
<span class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary-container rounded-tr-xl shadow-[0_0_12px_rgba(224,112,154,0.6)]"></span>
<span class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary-container rounded-bl-xl shadow-[0_0_12px_rgba(224,112,154,0.6)]"></span>
<span class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary-container rounded-br-xl shadow-[0_0_12px_rgba(224,112,154,0.6)]"></span>
<!-- Animated Scanner Beam -->
<div class="absolute inset-x-2 h-[2px] bg-gradient-to-r from-transparent via-primary-container to-transparent shadow-[0_0_14px_rgba(224,112,154,0.9)] animate-scan-beam"></div>
<!-- Faint Aim Reticle Center Marker -->
<div class="w-10 h-10 border border-outline-variant/30 rounded-full flex items-center justify-center opacity-40">
<div class="w-1.5 h-1.5 bg-primary rounded-full"></div>
</div>
</div>
<p class="z-20 font-body-md text-body-md text-on-surface-variant mt-space-md text-center">
        Align QR code within frame to scan
      </p>
<!-- Quick Action Controls Under Frame -->
<div class="flex items-center gap-space-md mt-space-sm z-20">
<button class="flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container border border-outline-variant/40 text-on-surface text-label-md font-label-md hover:bg-surface-container-high transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="flashlight_on">flashlight_on</span>
<span>Torch</span>
</button>
<button class="flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container border border-outline-variant/40 text-on-surface text-label-md font-label-md hover:bg-surface-container-high transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="image">image</span>
<span>From Gallery</span>
</button>
</div>
</div>
<!-- Bottom Sheet Drawer -->
<section class="bg-surface-container-low border-t border-outline-variant/30 rounded-t-3xl px-margin pt-space-md pb-space-sm z-30 shadow-[0_-12px_32px_rgba(0,0,0,0.5)]">
<!-- Drag handle indicator -->
<div class="w-10 h-1 bg-outline-variant/50 rounded-full mx-auto mb-space-sm"></div>
<!-- Standards Compatibility Chip -->
<div class="flex items-center justify-between py-space-xs px-space-sm bg-surface-container rounded-lg border border-outline-variant/20 mb-space-sm">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="verified_user">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant truncate max-w-[280px]">
            NIBSS NQR, YourApp Merchant &amp; Commercial POS
          </span>
</div>
<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-surface-container-high text-primary-fixed border border-outline-variant/30">
          Instant
        </span>
</div>
<!-- Recent Merchant Shortcut -->
<div class="mb-space-sm p-space-sm bg-surface-container rounded-xl border border-outline-variant/30 flex items-center justify-between hover:bg-surface-container-high transition-colors cursor-pointer">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary border border-outline-variant/40">
<span class="material-symbols-outlined text-[20px]" data-icon="storefront">storefront</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Last paid</span>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">SPAR Victoria Island</span>
</div>
</div>
<div class="text-right">
<span class="font-title-currency text-title-currency text-primary font-semibold tabular-nums">₦18,450</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Repeat</span>
</div>
</div>
<!-- Manual Code Entry CTA -->
<button class="w-full h-[52px] rounded-xl bg-surface-container border border-outline-variant text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center gap-space-xs hover:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="dialpad">dialpad</span>
<span>Enter Terminal or Merchant ID</span>
</button>
<!-- Bank Security Guarantee Pill -->
<footer class="mt-space-sm mb-space-xs flex items-center justify-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="lock">lock</span>
<p class="font-label-sm text-label-sm text-outline">
          Encrypted Central Clearing via NIBSS Nigeria • CBN Licensed
        </p>
</footer>
</section>
</main>
<script>
    const torchBtn = document.getElementById('torch-btn');
    if (torchBtn) {
      torchBtn.addEventListener('click', () => {
        torchBtn.classList.toggle('text-primary');
        torchBtn.classList.toggle('bg-primary-container');
        torchBtn.classList.toggle('text-on-primary-container');
      });
    }
  </script>
</body></html>
