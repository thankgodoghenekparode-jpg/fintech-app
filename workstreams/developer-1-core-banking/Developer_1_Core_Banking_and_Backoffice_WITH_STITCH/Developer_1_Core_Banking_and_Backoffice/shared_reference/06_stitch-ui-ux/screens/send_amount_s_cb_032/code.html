<span class="font-caption text-caption text-on-surface-variant font-medium">YourApp</span>

</div>

</span>
</div>
<p class="font-caption text-caption text-on-surface-variant truncate mt-0.5">

</div>
<button class="text-primary font-label text-label p-space-xs hover:underline flex-shrink-0" type="button">
