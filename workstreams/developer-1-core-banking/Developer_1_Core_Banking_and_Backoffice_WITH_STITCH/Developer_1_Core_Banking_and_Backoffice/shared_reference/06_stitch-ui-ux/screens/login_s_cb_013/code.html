<body class="bg-surface text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Container (Max 560px for tablet, 390px native mobile canvas) -->
<main class="w-full max-w-[560px] min-h-screen bg-surface flex flex-col justify-between relative px-margin pb-6 pt-3 select-none">
<!-- Top Content Wrap -->
<div class="w-full flex flex-col">
<!-- Top Bar: Brand Wordmark & Help Action (Suppressed Global Nav as per Task-focused Login Intent) -->
<header class="flex justify-between items-center w-full min-h-[56px] py-space-sm">
<div class="flex items-center gap-space-xs">
<span class="font-title text-title font-bold text-primary tracking-tight">YourApp</span>
</div>
<button aria-label="Customer Support Help" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- User Greeting Card -->
<section class="mt-space-sm bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-space-lg shadow-[0_2px_8px_-2px_rgba(30,26,27,0.05),0_1px_3px_0_rgba(30,26,27,0.03)] flex items-center justify-between">
<div class="flex items-center gap-space-md">

<div class="w-12 h-12 rounded-full bg-primary-fixed text-primary flex items-center justify-center font-subtitle text-subtitle font-bold tracking-tight shrink-0 border border-outline-variant/30">
            TA
          </div>

<div class="flex flex-col">
<h1 class="font-body-medium text-body-medium text-on-surface">Welcome back, Tunde</h1>
<p class="font-caption text-caption text-on-surface-variant tracking-wider">+234 801 ••• ••78</p>
</div>
</div>

<button class="font-label text-label text-primary hover:text-primary-container p-space-xs rounded transition-colors duration-150 shrink-0" type="button">
          Switch account
        </button>
</section>
<!-- Authentication Section -->
<section class="mt-space-xl flex flex-col items-center text-center">
<!-- Headline -->
<h2 class="font-subtitle text-subtitle text-on-surface tracking-tight">
          Enter your 6-digit passcode
        </h2>
<!-- Passcode Indicator: 6 Dots (1-3 Filled, 4th Cursor, 5-6 Empty) -->
<div aria-label="Passcode input dots, 3 of 6 entered" class="flex items-center justify-center gap-4 mt-space-lg h-8">
<!-- Pin 1: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container ring-2 ring-primary-container/20 transition-all duration-200"></div>
<!-- Pin 2: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container ring-2 ring-primary-container/20 transition-all duration-200"></div>
<!-- Pin 3: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container ring-2 ring-primary-container/20 transition-all duration-200"></div>
<!-- Pin 4: Active Pulse Cursor -->
<div class="w-4 h-4 rounded-full border-2 border-primary-container cursor-active-pulse bg-transparent"></div>
<!-- Pin 5: Inactive Empty -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/60"></div>
<!-- Pin 6: Inactive Empty -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/60"></div>
</div>
<!-- Biometric Prompt Trigger (Standardized 52px Primary Height) -->
<button class="mt-space-lg h-[52px] px-space-xl rounded-xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/40 flex items-center justify-center gap-space-sm text-primary font-label text-label active:scale-[0.98] transition-all duration-150 w-full max-w-[280px]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="fingerprint">fingerprint</span>

</button>

<button class="mt-space-md font-label text-label text-on-surface-variant hover:text-primary transition-colors duration-150 py-space-xs" type="button">
          Forgot passcode?
        </button>
</section>
</div>
<!-- Bottom Keypad and Security Trust Area -->
<div class="w-full flex flex-col items-center mt-auto">

<!-- Row 1 -->

<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">

</button>
<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
          3
          <span class="font-caption text-[10px] text-on-surface-variant/80 -mt-1 tracking-widest">DEF</span>
</button>
<!-- Row 2 -->

          4
          <span class="font-caption text-[10px] text-on-surface-variant/80 -mt-1 tracking-widest">GHI</span>
</button>
<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
          5
          <span class="font-caption text-[10px] text-on-surface-variant/80 -mt-1 tracking-widest">JKL</span>
</button>
<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
          6
          <span class="font-caption text-[10px] text-on-surface-variant/80 -mt-1 tracking-widest">MNO</span>
</button>
<!-- Row 3 -->

          8

</button>
<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
          9
          <span class="font-caption text-[10px] text-on-surface-variant/80 -mt-1 tracking-widest">WXYZ</span>
</button>
<!-- Row 4: Biometric Trigger | Zero | Delete Key -->
<button aria-label="Biometric authentication" class="h-14 rounded-xl flex items-center justify-center text-primary hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
<span class="material-symbols-outlined text-[28px]" data-icon="fingerprint">fingerprint</span>
</button>
<button class="h-14 rounded-xl flex flex-col items-center justify-center font-title text-title text-on-surface hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">

<button aria-label="Backspace" class="h-14 rounded-xl flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:bg-surface-container-high active:scale-95 transition-all duration-100 min-h-[48px] min-w-[48px]" type="button">
<span class="material-symbols-outlined text-[26px]" data-icon="backspace">backspace</span>
</button>

<span class="material-symbols-outlined text-[16px] text-primary" data-icon="lock">lock</span>
