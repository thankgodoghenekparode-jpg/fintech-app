<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;

<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex items-center justify-center p-0 md:p-6 selection:bg-primary-container selection:text-surface-container-lowest">
<!-- Mobile Viewport Shell (390px x 844px context) -->
<main class="w-full max-w-[390px] min-h-[844px] bg-surface flex flex-col justify-between relative shadow-2xl overflow-hidden border border-outline-variant/30 md:rounded-3xl">
<!-- Top App Bar / Security Header -->
<header class="w-full pt-4 pb-2 px-margin flex items-center justify-between z-10">
<!-- Back Navigation Action -->
<button aria-label="Go back" class="w-[52px] h-[52px] -ml-2 rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Center Security Lock Badge -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container border border-outline-variant/40 shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[16px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm text-primary-container font-semibold tracking-wider">SECURE SETUP</span>
</div>
<!-- Trailing Help Action -->
<button aria-label="Help and support" class="w-[52px] h-[52px] -mr-2 rounded-xl flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">help_outline</span>
</button>
</header>
<!-- Main Interactive Canvas -->
<div class="flex-1 flex flex-col px-margin pt-2 pb-3">
<!-- Eyebrow & Headline Group -->
<section class="text-center mt-1 mb-5">
<p class="font-label-sm text-label-sm text-outline tracking-widest mb-1.5 font-semibold">SECURITY SETUP</p>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 font-bold tracking-tight">Create your login passcode</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto leading-relaxed">
          You will use this 6-digit code to log into YourApp on this device
        </p>
</section>
<!-- 6-Digit Passcode Indicator (3 filled with subtle glow in #E0709A, 3 empty) -->
<section aria-label="Passcode entered: 3 of 6 digits" class="flex justify-center items-center gap-4 my-3">
<!-- Dot 1: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.65)] ring-2 ring-primary-container/40 transition-transform scale-110"></div>
<!-- Dot 2: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.65)] ring-2 ring-primary-container/40 transition-transform scale-110"></div>
<!-- Dot 3: Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.65)] ring-2 ring-primary-container/40 transition-transform scale-110"></div>
<!-- Dot 4: Empty -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/60"></div>
<!-- Dot 5: Empty -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/60"></div>
<!-- Dot 6: Empty -->
<div class="w-4 h-4 rounded-full bg-surface-container-high border border-outline-variant/60"></div>
</section>
<!-- Passcode Strength & Rule Checklist Card -->
<section class="my-4 bg-surface-container-low border border-outline-variant/40 rounded-xl p-3.5 space-y-2">
<!-- Rule 1 -->
<div class="flex items-center gap-2.5">
<div class="w-4 h-4 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[13px] text-primary-container">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">No repeating numbers (e.g. 111111)</span>
</div>
<!-- Rule 2 -->
<div class="flex items-center gap-2.5">
<div class="w-4 h-4 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[13px] text-primary-container">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">No simple sequences (e.g. 123456)</span>
</div>
<!-- Rule 3 -->
<div class="flex items-center gap-2.5">
<div class="w-4 h-4 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[13px] text-primary-container">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Do not use your date of birth</span>
</div>
</section>
<!-- Custom 3x4 Tactile Numeric Keypad -->
<section aria-label="Numeric keypad" class="mt-auto mb-2">
<div class="grid grid-cols-3 gap-2.5">
<!-- Key 1 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">1</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-widest"> </span>
</button>
<!-- Key 2 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">2</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">ABC</span>
</button>
<!-- Key 3 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">3</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">DEF</span>
</button>
<!-- Key 4 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">4</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">GHI</span>
</button>
<!-- Key 5 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">5</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">JKL</span>
</button>
<!-- Key 6 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">6</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">MNO</span>
</button>
<!-- Key 7 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">7</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">PQRS</span>
</button>
<!-- Key 8 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">8</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">TUV</span>
</button>
<!-- Key 9 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">9</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-wider">WXYZ</span>
</button>
<!-- Key Biometrics (Face / Fingerprint) -->
<button aria-label="Authenticate with biometrics" class="h-[54px] rounded-xl bg-surface-container-low/60 border border-outline-variant/30 flex items-center justify-center text-primary-container hover:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">fingerprint</span>
</button>
<!-- Key 0 -->
<button class="h-[54px] rounded-xl bg-surface-container-low border border-outline-variant/40 flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high active:bg-surface-container-highest active:scale-95 transition-all duration-150" type="button">
<span class="font-headline-sm text-headline-sm font-semibold leading-tight">0</span>
<span class="font-label-sm text-[9px] text-outline leading-none mt-0.5 tracking-widest">+</span>
</button>
<!-- Key Backspace -->
<button aria-label="Delete last digit" class="h-[54px] rounded-xl bg-surface-container-low/60 border border-outline-variant/30 flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
</section>
<!-- Bottom Security & Encryption Assurance -->
<footer class="pt-2 pb-1 flex items-center justify-center gap-1.5 text-center">
<span class="material-symbols-outlined text-outline text-[15px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-outline font-medium tracking-wide">
          Bank-grade 256-bit encryption
        </span>
</footer>
</div>
<!-- Home Indicator Bar -->
<div class="w-full flex justify-center pb-2 pt-1">
<div class="w-32 h-1 bg-surface-container-highest rounded-full"></div>
</div>
</main>
