<!-- Interactive script to handle keypad tap simulation and biometric prompt demo -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      let passcode = '123'; // Initial 3 entered digits for visual demonstration
      const maxDigits = 6;
      const displayContainer = document.getElementById('passcode-display');

      function updateDisplay() {
        if (!displayContainer) return;
        const dots = displayContainer.children;
        for (let i = 0; i < maxDigits; i++) {
          if (i < passcode.length) {
            // Active state
            dots[i].className = 'w-3.5 h-3.5 rounded-full bg-primary-container shadow-[0_0_12px_rgba(224,112,154,0.65)] ring-2 ring-primary/40 transition-all duration-200';
          } else {
            // Empty state
            dots[i].className = 'w-3.5 h-3.5 rounded-full bg-surface-container-high border border-outline-variant/60 transition-all duration-200';
          }
        }
      }

      // Add simple listeners for numeric keys
      const buttons = document.querySelectorAll('.key-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const numberText = btn.querySelector('.font-headline-md');
          const isDelete = btn.querySelector('[data-icon="backspace"]');
          const isBio = btn.querySelector('[data-icon="fingerprint"]');

          if (numberText && passcode.length < maxDigits) {
            passcode += numberText.textContent.trim();
            updateDisplay();
          } else if (isDelete && passcode.length > 0) {
            passcode = passcode.slice(0, -1);
            updateDisplay();
          } else if (isBio) {
            // Mock quick biometric trigger
            passcode = '123456';
            updateDisplay();
          }
        });
      });
    });
  </script>
