<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>YourApp - Scan &amp; Pay</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary-container": "#ffa0ba",
            "tertiary-fixed": "#eedee4",
            "on-primary-fixed-variant": "#881646",
            "surface-bright": "#fff8f8",
            "inverse-primary": "#ffb1c5",
            "surface-tint": "#a8315d",
            "on-surface-variant": "#564146",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f8eeef",
            "surface-container": "#f5eced",
            "tertiary": "#3b3236",
            "tertiary-fixed-dim": "#d1c3c8",
            "on-secondary": "#ffffff",
            "surface-container-highest": "#e9e0e1",
            "outline-variant": "#dcbfc5",
            "on-tertiary": "#ffffff",
            "primary-fixed": "#ffd9e1",
            "outline": "#897176",
            "on-secondary-fixed-variant": "#8c170e",
            "error-container": "#ffdad6",
            "on-tertiary-container": "#c6b7bd",
            "secondary": "#ae3123",
            "background": "#fff8f8",
            "surface-variant": "#e9e0e1",
            "on-tertiary-fixed-variant": "#4e4449",
            "surface-container-low": "#fbf1f2",
            "surface-container-lowest": "#ffffff",
            "on-background": "#1f1b1c",
            "primary-fixed-dim": "#ffb1c5",
            "error": "#ba1a1a",
            "surface-dim": "#e1d8d9",
            "inverse-surface": "#342f30",
            "on-surface": "#1f1b1c",
            "primary": "#6d0033",
            "on-error-container": "#93000a",
            "secondary-container": "#fc6955",
            "surface": "#fff8f8",
            "secondary-fixed-dim": "#ffb4a8",
            "secondary-fixed": "#ffdad4",
            "on-secondary-container": "#690000",
            "on-primary-fixed": "#3f001b",
            "primary-container": "#8e1b4a",
            "tertiary-container": "#53484d",
            "on-tertiary-fixed": "#21191e",
            "on-primary": "#ffffff",
            "surface-container-high": "#efe6e7",
            "on-secondary-fixed": "#410000"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-2xl": "2rem",
            "margin": "1rem",
            "space-md": "0.75rem",
            "gutter": "1rem",
            "space-3xl": "3rem",
            "space-xl": "1.5rem",
            "space-lg": "1rem"
          },
          "fontFamily": {
            "display": ["Inter"],
            "amount-lg": ["Inter"],
            "body": ["Inter"],
            "body-medium": ["Inter"],
            "subtitle": ["Inter"],
            "caption": ["Inter"],
            "amount-lg-mobile": ["Inter"],
            "label": ["Inter"],
            "title": ["Inter"]
          },
          "fontSize": {
            "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

            "amount-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "title": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }]
          }
        }
      }
    }
  </script>
<style>
    @keyframes laser-sweep {
      0%, 100% {
        top: 8px;
        opacity: 0.2;
      }
      50% {
        top: calc(100% - 10px);
        opacity: 0.95;
      }
    }
    .animate-scan {
      animation: laser-sweep 2.6s ease-in-out infinite;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#141011] text-on-surface antialiased flex justify-center items-center min-h-screen p-0 sm:py-6">
<!-- Mobile Canvas Device Frame (390 x 844) -->
<main class="w-full max-w-[390px] h-[844px] bg-[#1a1416] relative flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[40px] border border-white/10 select-none">
<!-- Camera Viewfinder Background Layer with Vignette & Ambient Light -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(45,20,30,0.6)_0%,_rgba(18,12,14,0.95)_100%)]"></div>
<!-- Simulated Camera Sensor Noise Pattern -->
<div class="absolute inset-0 opacity-[0.04] bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
</div>
<!-- UPPER VIEWPORT LAYER: Header, Controls & Mode Switcher -->
<header class="relative z-20 w-full pt-10 px-margin flex flex-col gap-space-md">
<!-- Top Navigation & Utility Controls -->
<div class="flex items-center justify-between min-h-[52px]">
<!-- Dismiss / Return -->
<button aria-label="Close scanner" class="w-[52px] h-[52px] rounded-full bg-black/40 backdrop-blur-md border border-white/15 text-white flex items-center justify-center active:scale-95 transition-transform hover:bg-black/60" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Screen Title -->
<div class="flex flex-col items-center">
<h1 class="font-subtitle text-subtitle text-white tracking-tight">Scan &amp; Pay</h1>
<span class="font-caption text-caption text-primary-fixed/80">YourApp Instant</span>
</div>
<!-- Torch & Gallery Actions Cluster -->
<div class="flex items-center gap-space-xs">
<!-- Torch Toggle -->
<button aria-label="Toggle flashlight" class="w-[52px] h-[52px] rounded-full bg-black/40 backdrop-blur-md border border-white/15 text-white flex items-center justify-center active:scale-95 transition-all hover:bg-black/60" id="torchToggle" type="button">
<span class="material-symbols-outlined text-[22px]" id="torchIcon">flash_on</span>
</button>
<!-- Upload QR from Gallery -->
<button aria-label="Import QR image from gallery" class="w-[52px] h-[52px] rounded-full bg-black/40 backdrop-blur-md border border-white/15 text-white flex items-center justify-center active:scale-95 transition-transform hover:bg-black/60" type="button">
<span class="material-symbols-outlined text-[22px]">photo_library</span>
</button>
</div>
</div>
<!-- Segmented Toggle Tabs: Scan QR vs My QR Code -->
<nav aria-label="QR Mode Selector" class="w-full bg-black/40 backdrop-blur-md p-[3px] rounded-xl border border-white/15 flex items-center">
<!-- Active Tab: Scan QR -->
<button aria-current="page" class="flex-1 h-[44px] rounded-lg bg-primary-container text-white font-label text-label flex items-center justify-center gap-space-xs shadow-sm transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">qr_code_scanner</span>
<span>Scan QR</span>
</button>
<!-- Inactive Tab: My QR Code -->
<button class="flex-1 h-[44px] rounded-lg text-white/70 hover:text-white font-label text-label flex items-center justify-center gap-space-xs transition-all active:scale-98" type="button">
<span class="material-symbols-outlined text-[18px]">qr_code_2</span>
<span>My QR Code</span>
</button>
</nav>
</header>
<!-- MIDDLE VIEWPORT LAYER: Viewfinder Frame & Interactive Reticle -->
<section class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin pt-1 pb-4">
<!-- Frame Container (256px x 256px Target Grid) -->
<div class="relative w-[256px] h-[256px] rounded-2xl flex items-center justify-center">
<!-- Animated Berry Scanning Laser Line -->
<div class="absolute left-2 right-2 h-[2px] bg-gradient-to-r from-transparent via-on-primary-container to-transparent shadow-[0_0_12px_2px_#ffa0ba] animate-scan z-20 pointer-events-none"></div>
<!-- High-Dignity Berry Corner Reticle Brackets -->
<!-- Top-Left -->
<div class="absolute -top-[1px] -left-[1px] w-8 h-8 border-t-[3.5px] border-l-[3.5px] border-on-primary-container rounded-tl-[16px]"></div>
<!-- Top-Right -->
<div class="absolute -top-[1px] -right-[1px] w-8 h-8 border-t-[3.5px] border-r-[3.5px] border-on-primary-container rounded-tr-[16px]"></div>
<!-- Bottom-Left -->
<div class="absolute -bottom-[1px] -left-[1px] w-8 h-8 border-b-[3.5px] border-l-[3.5px] border-on-primary-container rounded-bl-[16px]"></div>
<!-- Bottom-Right -->
<div class="absolute -bottom-[1px] -right-[1px] w-8 h-8 border-b-[3.5px] border-r-[3.5px] border-on-primary-container rounded-br-[16px]"></div>
<!-- Subtle Inner Frame Shadow Edge -->
<div class="absolute inset-0 rounded-2xl border border-white/10 bg-white/[0.02]"></div>
<!-- Reticle Crosshair Watermark in center -->
<div class="w-8 h-8 flex items-center justify-center text-white/20 pointer-events-none">
<span class="material-symbols-outlined text-[28px]">add</span>
</div>
</div>
<!-- Instruction Guidance Text -->
<p class="mt- space-lg font-body-medium text-body text-white/95 text-center px-4 tracking-tight drop-shadow-sm">
        Align NQR code within the frame to scan
      </p>
<!-- Institutional Verification / Support Badge -->
<div class="mt-space-sm inline-flex items-center gap-space-xs bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/15">
<span class="material-symbols-outlined text-[16px] text-primary-fixed" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-caption text-caption text-white/90">
          Nigeria Quick Response (NQR) &amp; YourApp QR supported
        </span>
</div>
</section>
<!-- BOTTOM SHEET LAYER: Docked Modern Light Surface Card -->
<section class="relative z-30 w-full bg-surface-container-lowest rounded-t-[28px] border-t border-outline-variant/40 shadow-[0_-8px_32px_rgba(0,0,0,0.35)] px-margin pt-4 pb-6 flex flex-col gap-space-md">
<!-- Tactile Drag Indicator Handle -->
<div class="w-10 h-1 bg-outline-variant/60 rounded-full mx-auto -mt-1 mb-1"></div>
<!-- Manual Identification Trigger Link -->
<div class="flex items-center justify-between">
<button class="group flex items-center gap-space-xs text-primary font-label text-label hover:underline active:scale-98 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">dialpad</span>
<span>Or enter merchant ID / phone manually</span>
</button>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:translate-x-0.5 transition-transform">chevron_right</span>
</div>
<!-- Horizontal Divider -->
<div class="w-full h-[1px] bg-surface-variant/80"></div>
<!-- Quick Recent Contacts & Merchants Cluster -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<span class="font-caption text-caption font-medium text-on-surface-variant">Recent Recipients</span>
<span class="font-caption text-caption text-primary cursor-pointer hover:underline">View All</span>
</div>
<!-- Horizontal Scrollable Quick-Select Avatar Strip -->
<div class="flex items-center gap-space-md pt-1 pb-1 overflow-x-auto no-scrollbar">
<!-- Merchant 1: Shoprite Ikeja -->
<button class="flex flex-col items-center gap-1 group flex-shrink-0 active:scale-95 transition-transform" type="button">
<div class="w-[52px] h-[52px] rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/50 group-hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[24px] text-primary">storefront</span>
</div>
<span class="font-caption text-caption font-medium text-on-surface text-center w-[72px] truncate">Shoprite Ikeja</span>
</button>
<!-- Merchant 2: Ebeano Supermarket -->
<button class="flex flex-col items-center gap-1 group flex-shrink-0 active:scale-95 transition-transform" type="button">
<div class="w-[52px] h-[52px] rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/50 group-hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[24px] text-primary">shopping_bag</span>
</div>
<span class="font-caption text-caption font-medium text-on-surface text-center w-[72px] truncate">Ebeano Super...</span>
</button>
<!-- Peer 3: Tunde A. -->
<button class="flex flex-col items-center gap-1 group flex-shrink-0 active:scale-95 transition-transform" type="button">
<div class="w-[52px] h-[52px] rounded-full bg-primary-fixed/60 flex items-center justify-center border border-primary/20 group-hover:border-primary transition-colors">
<span class="font-label text-label text-on-primary-fixed font-bold">TA</span>
</div>
<span class="font-caption text-caption font-medium text-on-surface text-center w-[72px] truncate">Tunde A.</span>
</button>
<!-- Peer 4: Chioma N. -->
<button class="flex flex-col items-center gap-1 group flex-shrink-0 active:scale-95 transition-transform" type="button">
<div class="w-[52px] h-[52px] rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/50 group-hover:border-primary transition-colors">
<span class="font-label text-label text-on-surface-variant font-bold">CN</span>
</div>
<span class="font-caption text-caption font-medium text-on-surface text-center w-[72px] truncate">Chioma N.</span>
</button>
</div>
</div>
<!-- Institutional Security Admonition Note -->
<div class="bg-surface-container-low rounded-xl p-space-sm flex items-start gap-space-xs border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px] text-primary flex-shrink-0 mt-0.5">verified_user</span>
<p class="font-caption text-caption text-on-surface-variant leading-tight">
<strong class="font-semibold text-on-surface">Security note:</strong> Always verify recipient name before entering your transaction PIN.
        </p>
</div>
</section>
</main>
<!-- Interactive State Controller (Vanilla Micro-Interactions) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const torchBtn = document.getElementById('torchToggle');
      const torchIcon = document.getElementById('torchIcon');
      let isTorchActive = false;

      torchBtn.addEventListener('click', () => {
        isTorchActive = !isTorchActive;
        if (isTorchActive) {
          torchBtn.classList.remove('bg-black/40', 'text-white');
          torchBtn.classList.add('bg-white', 'text-primary');
          torchIcon.textContent = 'flash_off';
        } else {
          torchBtn.classList.add('bg-black/40', 'text-white');
          torchBtn.classList.remove('bg-white', 'text-primary');
          torchIcon.textContent = 'flash_on';
        }
      });
    });
  </script>
</body></html>
