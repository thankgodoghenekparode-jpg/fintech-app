name: yourapp_mobile
description: YourApp mobile banking application
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  intl: ^0.20.3
  material_ui: ^1.11.0
  camera: ^0.12.2
  local_auth: 3.0.2
  share_plus: 12.0.2
  cross_file: 0.3.5+5
  geolocator: ^14.0.2
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal_drafts/
