name: sixth_pay_am_small_preview
description: Isolated non-production Pay Am Small customer preview.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sixth_pay_am_small:
    path: ../mobile

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/preview_only/marketplace-freezer.jpg
    - assets/preview_only/marketplace-solar.jpg
    - assets/preview_only/product-detail-freezer.jpg
    - assets/preview_only/storefront-vendor-avatar.jpg
    - assets/preview_only/storefront-freezer.jpg
    - assets/preview_only/storefront-television.jpg
    - assets/preview_only/storefront-cooker.jpg
    - assets/preview_only/storefront-ac.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
