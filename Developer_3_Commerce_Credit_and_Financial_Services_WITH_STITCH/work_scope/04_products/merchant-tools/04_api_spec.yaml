openapi: 3.0.3
info:
  title: Merchant and Small-Business Tools API
  version: 1.0.0
  description: Product API. Uses the core conventions (Idempotency-Key, X-Pin-Token,
    X-Tenant-Id, error format). Amounts in kobo.
security:
- bearerAuth: []
paths:
  /business:
    post:
      tags:
      - Merchant
      summary: Create business
      description: 'Roles: any authenticated customer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legalName:
                  type: string
                type:
                  type: string
                registrationNumber:
                  type: string
                ownerIdFileKey:
                  type: string
                settlementAccount:
                  type: string
              required:
              - legalName
              - type
              - ownerIdFileKey
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/home:
    get:
      tags:
      - Merchant
      summary: Business home figures
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/payment-requests:
    post:
      tags:
      - Merchant
      summary: Create link or QR
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - LINK
                  - QR_STATIC
                  - QR_DYNAMIC
                amountKobo:
                  type: integer
                  format: int64
                  description: Amount in kobo
                description:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                multiUse:
                  type: boolean
              required:
              - kind
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Merchant
      summary: List links and QR
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/invoices:
    post:
      tags:
      - Merchant
      summary: Create invoice
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  additionalProperties: true
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                dueDate:
                  type: string
                  format: date
                taxBps:
                  type: integer
                notes:
                  type: string
              required:
              - customer
              - items
              - dueDate
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Merchant
      summary: List invoices
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/invoices/{invoiceId}/send:
    post:
      tags:
      - Merchant
      summary: Send or remind
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - LINK
                  - SMS
                  - EMAIL
              required:
              - channel
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/transactions:
    get:
      tags:
      - Merchant
      summary: Payments and payouts
      description: 'Roles: any authenticated customer'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/payouts:
    post:
      tags:
      - Merchant
      summary: Request payout
      description: 'Roles: Owner'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PinToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountKobo:
                  type: integer
                  format: int64
                  description: Amount in kobo
                destination:
                  type: string
              required:
              - amountKobo
              - destination
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/payments/{paymentId}/refund:
    post:
      tags:
      - Merchant
      summary: Refund
      description: 'Roles: Manager'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PinToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountKobo:
                  type: integer
                  format: int64
                  description: Amount in kobo
                reason:
                  type: string
              required:
              - amountKobo
              - reason
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/team:
    post:
      tags:
      - Merchant
      summary: Add team member
      description: 'Roles: Owner'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                role:
                  type: string
                  enum:
                  - MANAGER
                  - CASHIER
                  - ACCOUNTANT
              required:
              - phone
              - role
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/reports/{type}:
    get:
      tags:
      - Merchant
      summary: Reports
      description: 'Roles: Accountant'
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: format
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /pay/{reference}:
    get:
      tags:
      - Public
      summary: 'Public: resolve a link/QR reference'
      description: 'Roles: any authenticated customer'
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /pay/{reference}/pay:
    post:
      tags:
      - Public
      summary: Pay a link or QR from the app
      description: 'Roles: any authenticated customer'
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PinToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountKobo:
                  type: integer
                  format: int64
                  description: Amount in kobo
      responses:
        '201':
          description: OK
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PinToken:
      name: X-Pin-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error (see core ERROR_CODES.md)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
              requestId:
                type: string
